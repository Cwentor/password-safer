<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Password Safer 项目图标：金库保管箱 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="inner" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="keyhole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#93c5fd" stroke-opacity="0.25" stroke-width="2"/>

  <!-- 金库门 -->
  <circle cx="64" cy="64" r="42" fill="url(#door)" stroke="#475569" stroke-width="3"/>
  <circle cx="64" cy="64" r="32" fill="url(#inner)" stroke="#1e293b" stroke-width="2"/>

  <!-- 转盘刻度 -->
  <g stroke="#e2e8f0" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="24" x2="64" y2="31"/>
    <line x1="64" y1="97" x2="64" y2="104"/>
    <line x1="24" y1="64" x2="31" y2="64"/>
    <line x1="97" y1="64" x2="104" y2="64"/>
  </g>

  <!-- 锁孔 -->
  <circle cx="64" cy="58" r="8.5" fill="url(#keyhole)"/>
  <path d="M60.5 63 L67.5 63 L71 84 L57 84 Z" fill="url(#keyhole)"/>

  <!-- 门栓高光 -->
  <g fill="#f8fafc">
    <circle cx="38" cy="38" r="2.5" opacity="0.85"/>
    <circle cx="90" cy="38" r="2.5" opacity="0.85"/>
    <circle cx="38" cy="90" r="2.5" opacity="0.85"/>
    <circle cx="90" cy="90" r="2.5" opacity="0.85"/>
  </g>
</svg>
