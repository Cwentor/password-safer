[package]
name = "password-safer"
version = "2.0.1"
description = "本地加密密码保管箱 - 支持 SQLite 存储 + 网盘云同步"
edition = "2021"

[lib]
name = "password_safer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "blocking", "cookies"], default-features = false }
aes-gcm = "0.10"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
dirs = "5"
qrcode = "0.14"
image = "0.25"
sha1 = "0.10"
